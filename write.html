<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introvert — studio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- Quill Rich Text Editor CDN -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

    <style>
        /* -------------------------------------------------------------
           Design System: introvert studio - Ulysses & Notion style
           ------------------------------------------------------------- */
        :root {
            --bg-color: #FAF8F5;
            /* Warm book paper */
            --bg-card: #FFFFFF;
            --bg-accent: #F4F1EC;
            /* Slightly darker warm tone */
            --text-primary: #2C2A27;
            /* Ink color */
            --text-muted: #7A756D;
            /* Faded warm grey */
            --border-color: #E5E0D8;
            /* Warm border */
            --accent: #8B7355;
            /* Elegant brass */
            --accent-hover: #6D5940;
            --accent-light: #EFEBE4;
            --font-heading: 'EB Garamond', Georgia, serif;
            --font-body: 'Lora', Georgia, serif;
            --shadow-subtle: none;
            --shadow-focus: none;
            --transition-smooth: color 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #101112;
                --bg-card: #151719;
                --bg-accent: #1d2023;
                --text-primary: #ede8df;
                --text-muted: #aaa195;
                --border-color: #303337;
                --accent: #c5a775;
                --accent-hover: #dcc38f;
                --accent-light: #27241f;
                color-scheme: dark;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        *,
        *::before,
        *::after {
            animation: none !important;
            transition-duration: 0.16s !important;
        }

        /* -------------------------------------------------------------
           Layout Split Screen
           ------------------------------------------------------------- */
        /* Left Sidebar - Control Panel & Listing */
        .sidebar {
            width: 320px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 10;
            transition: var(--transition-smooth);
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .sidebar-logo {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: var(--text-primary);
            display: block;
            margin-bottom: 0.2rem;
        }

        .sidebar-tagline {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 0.05em;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Group card styling */
        .sidebar-group {
            margin-bottom: 2rem;
        }

        .sidebar-group-title {
            font-family: var(--font-heading);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
        }

        /* Input styling in sidebar */
        .sidebar-input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            border-radius: 4px;
            margin-bottom: 0.8rem;
            transition: var(--transition-smooth);
        }

        .sidebar-input:focus {
            outline: none;
            border-color: var(--accent);
            background-color: var(--bg-card);
            box-shadow: none;
        }

        /* Sidebar Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.2rem;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--bg-accent);
            border-color: var(--text-muted);
        }

        /* Published Articles List */
        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 0.5rem;
        }

        .post-item {
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .post-item:hover {
            border-color: var(--accent);
            background-color: var(--bg-accent);
            box-shadow: var(--shadow-subtle);
        }

        .post-item-title {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-item-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Status notification banner */
        .status-banner {
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .status-success {
            background-color: #E6EFEA;
            color: #2D583F;
            border: 1px solid #C9DFD3;
        }

        .status-error {
            background-color: #F8ECE8;
            color: #8C533C;
            border: 1px solid #EED4CC;
        }

        /* -------------------------------------------------------------
           Right main writing canvas
           ------------------------------------------------------------- */
        .writer-main {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 4rem 2rem;
            display: flex;
            justify-content: center;
        }

        .writer-canvas {
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Meta details area (Date) */
        .canvas-meta {
            margin-bottom: 1rem;
        }

        .input-date {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            width: 150px;
            padding: 0.2rem 0;
            transition: var(--transition-smooth);
            letter-spacing: 0.05em;
        }

        .input-date:focus {
            outline: none;
            border-bottom-color: var(--border-color);
            color: var(--text-primary);
        }

        /* Title Area - Medium Style */
        .canvas-title {
            margin-bottom: 1.5rem;
        }

        .input-title {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            width: 100%;
            padding: 0.3rem 0;
            transition: var(--transition-smooth);
            line-height: 1.2;
        }

        .input-title:focus {
            outline: none;
            border-bottom-color: var(--border-color);
        }

        .input-title::placeholder {
            color: var(--border-color);
        }

        /* Preview description area */
        .canvas-preview {
            margin-bottom: 2.5rem;
        }

        .input-preview {
            font-family: var(--font-body);
            font-size: 1.15rem;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            width: 100%;
            padding: 0.4rem 0;
            transition: var(--transition-smooth);
        }

        .input-preview:focus {
            outline: none;
            border-bottom-color: var(--border-color);
            color: var(--text-primary);
        }

        .input-preview::placeholder {
            color: var(--border-color);
            font-style: italic;
        }

        /* -------------------------------------------------------------
           Quill Custom Styling to match book theme
           ------------------------------------------------------------- */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 3rem;
            min-height: 350px;
        }

        /* Override Quill border and themes */
        .ql-toolbar.ql-snow {
            border: none !important;
            border-bottom: 1px solid var(--border-color) !important;
            background-color: var(--bg-card);
            padding: 0.8rem 0 !important;
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .ql-container.ql-snow {
            border: none !important;
            font-family: var(--font-body) !important;
            font-size: 1.2rem !important;
            line-height: 1.9 !important;
            color: var(--text-primary) !important;
            flex: 1;
        }

        .ql-editor {
            padding: 2rem 0 !important;
            min-height: 300px;
        }

        .ql-editor.ql-blank::before {
            color: var(--border-color) !important;
            font-style: italic !important;
            left: 0 !important;
        }

        /* Custom Quill toolbar buttons style */
        .ql-snow .ql-stroke {
            stroke: var(--text-muted) !important;
        }

        .ql-snow .ql-fill {
            fill: var(--text-muted) !important;
        }

        .ql-snow .ql-picker {
            color: var(--text-muted) !important;
        }

        .ql-snow.ql-toolbar button:hover .ql-stroke,
        .ql-snow .ql-toolbar button:hover .ql-stroke,
        .ql-snow.ql-toolbar button.ql-active .ql-stroke,
        .ql-snow .ql-toolbar button.ql-active .ql-stroke {
            stroke: var(--accent) !important;
        }

        .ql-snow.ql-toolbar button:hover .ql-fill,
        .ql-snow .ql-toolbar button:hover .ql-fill,
        .ql-snow.ql-toolbar button.ql-active .ql-fill,
        .ql-snow .ql-toolbar button.ql-active .ql-fill {
            fill: var(--accent) !important;
        }

        /* Bottom publish bar */
        .publish-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .publish-footer .btn {
            width: auto;
            padding: 0.9rem 2.5rem;
            font-size: 1.05rem;
            box-shadow: var(--shadow-subtle);
        }

        .publish-footer .btn:hover {
            box-shadow: var(--shadow-focus);
            transform: none;
        }

        /* -------------------------------------------------------------
           Animations
           ------------------------------------------------------------- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* -------------------------------------------------------------
           Responsive (Mobile drawer overlay)
           ------------------------------------------------------------- */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .writer-main {
                height: auto;
                overflow: visible;
                padding: 2rem 1.25rem;
            }

            .input-title {
                font-size: 2.2rem;
            }
        }

        @media (prefers-color-scheme: dark) {
            .btn-primary {
                color: #101112;
            }

            .btn-secondary,
            .post-item,
            .sidebar-input,
            .ql-toolbar.ql-snow {
                background-color: var(--bg-accent);
            }

            .status-success {
                background-color: #1d2a23;
                color: #b8d8c3;
                border-color: #2c4b38;
            }

            .status-error {
                background-color: #2b1d19;
                color: #e0b4a6;
                border-color: #57352b;
            }

            .ql-editor,
            .ql-container.ql-snow {
                background-color: var(--bg-color);
                color: var(--text-primary) !important;
            }

            .ql-picker-options {
                background-color: var(--bg-card) !important;
                border-color: var(--border-color) !important;
            }
        }

        /* Minimal border pass */
        .sidebar,
        .sidebar-header,
        .sidebar-group-title,
        .ql-toolbar.ql-snow {
            border-color: transparent !important;
        }

        .btn,
        .post-item {
            border: 0 !important;
            box-shadow: none !important;
        }

        .sidebar-input,
        .input-date,
        .input-title,
        .input-preview {
            border: 0 !important;
            background-color: var(--bg-accent);
        }

        .input-date,
        .input-title,
        .input-preview {
            background-color: transparent;
        }

        .sidebar-input:focus,
        .input-date:focus,
        .input-title:focus,
        .input-preview:focus {
            outline: 1px solid color-mix(in srgb, var(--border-color) 55%, transparent);
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <!-- Left Sidebar: Configuration Panel & List -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo">introvert</a>
            <div class="sidebar-tagline">thoughts, slowly.</div>
        </div>

        <div class="sidebar-content">

            <!-- Status Message Banner -->
            <div id="status-banner" class="status-banner"></div>

            <!-- Group 1: Security -->
            <div class="sidebar-group">
                <h3 class="sidebar-group-title">Bảo mật</h3>
                <label for="lock-password"
                    style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal; margin-bottom: 0.3rem;">Mật
                    mã bẻ khóa / đẩy bài:</label>
                <input type="password" id="lock-password" class="sidebar-input" placeholder="Nhập mật mã của bạn...">
                <button class="btn btn-secondary" id="load-posts-btn" style="gap: 0.5rem;">
                    Tải bài viết từ Sheet
                </button>
            </div>

            <!-- Group 2: Published list -->
            <div class="sidebar-group">
                <h3 class="sidebar-group-title">Danh sách trên Sheet</h3>
                <div class="posts-container" id="posts-list">
                    <p
                        style="color: var(--text-muted); font-size: 0.85rem; font-style: italic; text-align: center; padding: 1rem 0;">
                        Nhập mật mã và bấm tải danh sách bài viết.
                    </p>
                </div>
            </div>

            <div class="sidebar-group" style="margin-bottom: 0; text-align: center;">
                <a href="index.html" class="btn btn-secondary"
                    style="text-decoration: none; font-size: 0.85rem; padding: 0.6rem;">← Quay lại Trang chủ</a>
            </div>

        </div>
    </aside>

    <!-- Right Area: Focused Writing Document Canvas -->
    <main class="writer-main">
        <div class="writer-canvas">

            <!-- Post Date Input -->
            <div class="canvas-meta">
                <input type="text" id="post-date" class="input-date" placeholder="Ngày (ví dụ: 03.2026)">
            </div>

            <!-- Post Title Input -->
            <div class="canvas-title">
                <input type="text" id="post-title" class="input-title" placeholder="Tên bài viết...">
            </div>

            <!-- Post Preview Text Input -->
            <div class="canvas-preview">
                <input type="text" id="post-preview" class="input-preview"
                    placeholder="Mô tả tóm tắt ngắn hiện ở trang chủ...">
            </div>

            <!-- Rich Text Editor Container -->
            <div class="editor-container">
                <div id="editor"></div>
            </div>

            <!-- Publish Button Area -->
            <div class="publish-footer">
                <button class="btn btn-primary" id="publish-btn">Đăng bài viết</button>
            </div>

        </div>
    </main>

    <!-- Quill Editor Library -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <script>
        /* =============================================================
           CẤU HÌNH LIÊN KẾT GOOGLE APPS SCRIPT WEB APP
           Dán URL Apps Script Web App của bạn vào đây (Xem hướng dẫn trong README.md)
           ============================================================= */
        const GOOGLE_APPS_SCRIPT_URL = "/api/sheet";
        const UNLOCK_API_URL = "/api/unlock";
        const VIETNAM_TIME_ZONE = "Asia/Ho_Chi_Minh";
        let privateSessionToken = "";

        // --- CẤU HÌNH KHỞI TẠO TRÌNH SOẠN THẢO QUILL ---
        const quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Viết nội dung suy nghĩ của bạn ở đây...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],        // định dạng chữ
                    ['blockquote', 'code-block'],                     // trích dẫn, mã
                    [{ 'header': 2 }, { 'header': 3 }],               // các thẻ tiêu đề h2, h3
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],     // danh sách
                    ['clean']                                         // xóa định dạng
                ]
            }
        });

        // --- CÁC HÀM MÃ HÓA CRYPTO API (AES-256-GCM) ---
        async function deriveKey(password, salt) {
            const encoder = new TextEncoder();
            const passwordKey = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                passwordKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(plaintext, password) {
            const encoder = new TextEncoder();
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);

            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoder.encode(plaintext)
            );

            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);

            let binary = '';
            const len = combined.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(combined[i]);
            }
            return btoa(binary);
        }

        async function decryptData(ciphertextBase64, password) {
            const decoder = new TextDecoder();
            const binaryString = atob(ciphertextBase64);
            const combined = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                combined[i] = binaryString.charCodeAt(i);
            }

            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const ciphertext = combined.slice(28);

            const key = await deriveKey(password, salt);
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                ciphertext
            );
            return decoder.decode(decrypted);
        }

        // --- TƯƠNG TÁC GIAO DIỆN ---
        const statusBanner = document.getElementById('status-banner');
        const passwordField = document.getElementById('lock-password');
        const postsList = document.getElementById('posts-list');

        function showStatus(text, isError = false) {
            statusBanner.textContent = text;
            statusBanner.className = `status-banner ${isError ? 'status-error' : 'status-success'}`;
            statusBanner.style.display = 'block';
            setTimeout(() => {
                statusBanner.style.display = 'none';
            }, 6000);
        }

        async function fetchSheetJson(type, label = "dữ liệu") {
            if (!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL.trim() === "") {
                throw new Error("Chưa cấu hình Google Apps Script URL.");
            }

            const separator = GOOGLE_APPS_SCRIPT_URL.includes('?') ? '&' : '?';
            const response = await fetch(`${GOOGLE_APPS_SCRIPT_URL}${separator}type=${encodeURIComponent(type)}`);
            const text = await response.text();

            if (!response.ok) {
                throw new Error(`Không thể tải ${label} từ Sheet.`);
            }

            try {
                return JSON.parse(text);
            } catch (err) {
                throw new Error(`Proxy không trả JSON hợp lệ cho ${label}.`);
            }
        }

        async function requestPrivateUnlock(passcode) {
            const response = await fetch(UNLOCK_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ passcode })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || !result.success || !result.token) {
                throw new Error(result.error || "Mật mã chưa chính xác.");
            }
            privateSessionToken = result.token;
            return result.token;
        }

        function getPrivateSheetHeaders(baseHeaders = {}) {
            return privateSessionToken
                ? { ...baseHeaders, Authorization: `Bearer ${privateSessionToken}` }
                : baseHeaders;
        }

        function formatVietnamDateTime(value, options = {}) {
            if (!value) return "";

            const date = value instanceof Date ? value : new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);

            const includeTime = options.includeTime !== false;
            const parts = new Intl.DateTimeFormat("vi-VN", {
                timeZone: VIETNAM_TIME_ZONE,
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: includeTime ? "2-digit" : undefined,
                minute: includeTime ? "2-digit" : undefined,
                hour12: false
            }).formatToParts(date).reduce((acc, part) => {
                acc[part.type] = part.value;
                return acc;
            }, {});

            const dateText = `${parts.day}/${parts.month}/${parts.year}`;
            return includeTime ? `${dateText} ${parts.hour}:${parts.minute} GMT+7` : dateText;
        }

        // Tải danh sách bài viết từ Sheet và giải mã
        document.getElementById('load-posts-btn').addEventListener('click', async () => {
            const password = passwordField.value;
            if (!password) {
                showStatus("Vui lòng nhập mật mã bảo mật để tải dữ liệu!", true);
                return;
            }
            if (!GOOGLE_APPS_SCRIPT_URL) {
                showStatus("Bạn chưa cấu hình URL Google Apps Script Web App!", true);
                return;
            }

            postsList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; font-style: italic; text-align: center; padding: 1rem 0;">Đang kết nối...</p>';

            try {
                await requestPrivateUnlock(password);
                const encryptedRows = await fetchSheetJson("articles", "bài viết");
                const articles = [];
                let decryptFailCount = 0;

                for (const row of encryptedRows) {
                    if (!row || !row.title || !row.content || !row.preview) {
                        continue;
                    }

                    try {
                        const decTitle = await decryptData(row.title, password);
                        articles.push({
                            date: row.date,
                            displayDate: row.displayDate,
                            title: decTitle
                        });
                    } catch (e) {
                        decryptFailCount++;
                    }
                }

                if (decryptFailCount > 0 && articles.length === 0) {
                    throw new Error("Mật mã chưa chính xác.");
                }

                renderLoadedPosts(articles);
                showStatus(`Đã tải thành công ${articles.length} bài viết.`);

            } catch (err) {
                console.error(err);
                postsList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; font-style: italic; text-align: center; padding: 1rem 0;">Lỗi tải dữ liệu.</p>';
                showStatus(err.message, true);
            }
        });

        function renderLoadedPosts(articles) {
            postsList.innerHTML = '';
            if (articles.length === 0) {
                postsList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; font-style: italic; text-align: center; padding: 1rem 0;">Bảng tính trống.</p>';
                return;
            }
            articles.forEach(art => {
                const item = document.createElement('div');
                item.className = 'post-item';
                item.innerHTML = `
                    <div class="post-item-title">${art.title}</div>
                    <div class="post-item-date">${art.displayDate || formatVietnamDateTime(art.date) || 'Không rõ'}</div>
                `;
                postsList.appendChild(item);
            });
        }

        // Tự động điền ngày giờ hiện tại theo GMT+7 khi load trang
        const dateInput = document.getElementById('post-date');
        if (dateInput) {
            dateInput.value = formatVietnamDateTime(new Date());
        }

        // Đăng bài viết mới
        document.getElementById('publish-btn').addEventListener('click', async () => {
            const password = passwordField.value;
            const date = document.getElementById('post-date').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const preview = document.getElementById('post-preview').value.trim();

            // Lấy mã HTML được định dạng từ Quill Editor
            const contentHTML = quill.root.innerHTML.trim();
            // Lấy văn bản thô để validate
            const rawText = quill.getText().trim();

            if (!password) {
                showStatus("Vui lòng nhập mật mã ở cột trái trước khi đăng bài!", true);
                passwordField.focus();
                return;
            }
            if (!title || rawText === "") {
                showStatus("Vui lòng nhập Tiêu đề và Nội dung bài viết!", true);
                return;
            }
            if (!GOOGLE_APPS_SCRIPT_URL) {
                showStatus("Chưa cấu hình URL Google Apps Script Web App!", true);
                return;
            }

            showStatus("Đang tiến hành mã hóa dữ liệu & đăng bài...");

            try {
                await requestPrivateUnlock(password);
                await fetchSheetJson("articles", "bài viết");

                // Mã hóa các trường dữ liệu trước khi gửi
                const encTitle = await encryptData(title, password);
                const encPreview = await encryptData(preview, password);
                const encContent = await encryptData(contentHTML, password);

                const payload = {
                    type: "article",
                    date: new Date().toISOString(),
                    displayDate: date || formatVietnamDateTime(new Date()),
                    title: encTitle,
                    preview: encPreview,
                    content: encContent
                };

                const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: getPrivateSheetHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(payload)
                });

                const resultText = await response.text();
                let result = {};
                try {
                    result = resultText ? JSON.parse(resultText) : {};
                } catch (parseErr) {
                    throw new Error("Proxy không trả JSON hợp lệ.");
                }

                if (!response.ok || result.success === false) {
                    throw new Error(result.error || "Apps Script từ chối lưu bài viết.");
                }

                showStatus("Đăng bài viết thành công! Hãy đợi vài giây rồi bấm tải lại danh sách bên trái.");

                // Reset form viết bài
                document.getElementById('post-title').value = "";
                document.getElementById('post-preview').value = "";
                quill.setContents([]);

            } catch (err) {
                console.error(err);
                showStatus("Đăng bài thất bại: " + err.message, true);
            }
        });
    </script>
</body>

</html>
