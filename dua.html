<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introvert — góc của dứa</title>
    <meta name="description" content="Nơi lưu giữ các khoảnh khắc đáng yêu, nhật ký và video của Dứa.">
    
    <!-- Google Fonts - Nunito (Cute & Rounded, Perfect Vietnamese support) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css?v=20260605-pineapple-v2">
</head>
<body class="pineapple-page">

    <!-- Password Lock Overlay -->
    <div id="password-overlay" class="password-overlay">
        <div class="password-box pineapple-lock-box">
            <div class="pineapple-avatar wobble-anim">✨</div>
            <p class="password-hint" data-i18n="dua.password.hint">Góc của dứa. Vui lòng nhập mật mã 6 số để mở khóa.</p>
            <form id="password-form">
                <div class="passcode-inputs">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="passcode-digit" aria-label="Số thứ 1" autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="passcode-digit" aria-label="Số thứ 2" autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="passcode-digit" aria-label="Số thứ 3" autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="passcode-digit" aria-label="Số thứ 4" autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="passcode-digit" aria-label="Số thứ 5" autocomplete="off">
                    <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="passcode-digit" aria-label="Số thứ 6" autocomplete="off">
                </div>
                <button type="submit" id="passcode-unlock-btn" class="passcode-unlock-btn" data-i18n="password.unlock">mở khóa</button>
            </form>
            <p id="password-status" class="password-status" aria-live="polite"></p>
        </div>
    </div>

    <!-- Main Content (Hidden until unlocked) -->
    <div id="pineapple-app" style="display: none;">
        <!-- Header Navigation -->
        <header class="main-header">
            <nav class="nav-container">
                <a href="index.html" class="header-brand" aria-label="Về trang chủ">
                    <div class="header-logo-container">
                        <span class="header-logo-text">dứa corner</span>
                    </div>
                </a>
                <div class="nav-links">
                    <a href="index.html" class="nav-link" data-i18n="nav.home">home</a>
                    <span class="nav-separator">/</span>
                    <a href="writings.html" class="nav-link" data-i18n="nav.writings">writings</a>
                    <span class="nav-separator">/</span>
                    <a href="journal.html" class="nav-link" data-i18n="nav.journal">journal</a>
                    <span class="nav-separator">/</span>
                    <a href="games.html" class="nav-link" data-i18n="nav.games">games</a>
                    <span class="nav-separator">/</span>
                    <span class="nav-link active-link" data-i18n="nav.pineapple">góc của dứa</span>
                </div>
            </nav>
        </header>

        <!-- Hero Section -->
        <main class="content-container">
            <section class="dua-hero">
                <p class="dua-kicker" data-i18n="dua.kicker">khoảnh khắc & nhật ký</p>
                <div class="dua-title-row">
                    <h1 data-i18n="dua.title">góc của dứa</h1>
                    <button id="dua-add-trigger" class="dua-btn-primary" data-i18n="dua.add.btn">Đăng bài</button>
                </div>
            </section>

            <!-- Categories Tabs Filters -->
            <section class="dua-filters-container">
                <div class="dua-filters">
                    <button class="dua-filter-btn active" data-category="all" data-i18n="dua.filter.all">tất cả</button>
                    <button class="dua-filter-btn" data-category="live-current" data-i18n="dua.filter.live-current">đang live 🔴</button>
                    <button class="dua-filter-btn" data-category="live-recent" data-i18n="dua.filter.live-recent">live gần đây 📹</button>
                    <button class="dua-filter-btn" data-category="short" data-i18n="dua.filter.short">shorts ⚡</button>
                    <button class="dua-filter-btn" data-category="video" data-i18n="dua.filter.video">video 🎬</button>
                    <button class="dua-filter-btn" data-category="writing" data-i18n="dua.filter.writing">viết lách ✍️</button>
                    <button class="dua-filter-btn" data-category="message" data-i18n="dua.filter.message">lời nhắn 💬</button>
                    <button class="dua-filter-btn" data-category="journal" data-i18n="dua.filter.journal">nhật ký 📖</button>
                </div>
            </section>

            <!-- Dynamic Moments Feed -->
            <section class="dua-feed-section">
                <div id="dua-status" class="dua-status-bar"></div>
                <div id="dua-feed" class="dua-feed-grid">
                    <!-- Cards will be populated dynamically -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Form (Hidden by default) -->
    <div id="dua-modal" class="dua-modal-overlay" style="display: none;">
        <div class="dua-modal-box">
            <h2 class="dua-modal-title" data-i18n="dua.add.title">Thêm khoảnh khắc mới</h2>
            <form id="dua-modal-form">
                <label for="dua-category">
                    <span data-i18n="dua.add.category">Danh mục</span>
                    <select id="dua-category" required>
                        <option value="video">video 🎬</option>
                        <option value="live-current">đang live 🔴</option>
                        <option value="live-recent">live gần đây 📹</option>
                        <option value="short">shorts ⚡</option>
                        <option value="writing">viết lách ✍️</option>
                        <option value="message">lời nhắn 💬</option>
                        <option value="journal">nhật ký 📖</option>
                    </select>
                </label>

                <label for="dua-title">
                    <span data-i18n="dua.add.itemTitle">Tiêu đề</span>
                    <input type="text" id="dua-title" placeholder="Tiêu đề bài đăng..." required>
                </label>

                <label for="dua-content">
                    <span data-i18n="dua.add.itemContent">Nội dung / Lời nhắn</span>
                    <textarea id="dua-content" rows="4" placeholder="Nội dung chi tiết hoặc nhật ký..."></textarea>
                </label>

                <!-- Media Link Input -->
                <label for="dua-mediaUrl">
                    <span data-i18n="dua.add.mediaUrl">Link video (YouTube) hoặc dán link ảnh</span>
                    <input type="url" id="dua-mediaUrl" placeholder="https://youtube.com/... hoặc link ảnh Drive...">
                </label>

                <!-- Direct Drive Upload Option -->
                <div class="dua-upload-container">
                    <label id="dua-upload-label" for="dua-file-input" class="dua-upload-btn" data-i18n="dua.add.uploadBtn">Tải ảnh lên từ máy</label>
                    <input type="file" id="dua-file-input" accept="image/*" style="display: none;">
                    <span id="dua-upload-status" class="dua-upload-status-text"></span>
                </div>

                <div class="dua-modal-actions">
                    <button type="submit" id="dua-save-btn" class="dua-btn-primary" data-i18n="dua.add.submit">Đăng lên</button>
                    <button type="button" id="dua-modal-close" class="dua-btn-secondary" data-i18n="dua.add.cancel">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="site-i18n.js?v=20260605-pineapple-v2"></script>
    <script src="dua.js?v=20260605-pineapple-v2"></script>
</body>
</html>
